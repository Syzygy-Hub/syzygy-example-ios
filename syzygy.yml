description: "Reference iOS app that composes the Syzygy layers with SwiftUI and a demo login"
demonstrates: [foundation, ui, core, services, ai, base]
depends_on:
  - name: syzygy-foundation-ios
    version_constraint: ">=3.0.0"
  - name: syzygy-core-ios
    version_constraint: ">=3.0.0"
  - name: syzygy-services-ios
    version_constraint: ">=3.0.0"
  - name: syzygy-ai-ios
    version_constraint: ">=3.0.0"
  - name: syzygy-ui-ios
    version_constraint: ">=3.0.0"
